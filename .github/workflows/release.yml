name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Pure Go (no CGO), so one runner cross-compiles every target. linux/arm
      # covers 32-bit Raspberry Pi OS, part of the small-hardware audience.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/searcher-$GITHUB_REF_NAME-$os-$arch$ext" .
          done
          cd dist && sha256sum * > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
